<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer rhythmic orbital ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Blooming Lotus / Phase Flower -->
  <g filter="url(#shadow)" transform="translate(256, 250)">
    <!-- Back Petals -->
    <path d="M 0,-130 C -45,-80 -70,-20 -50,50 C -20,70 20,70 50,50 C 70,-20 45,-80 0,-130 Z" fill="url(#petalGrad)" opacity="0.9" />
    <path d="M -90,-80 C -120,-30 -110,30 -70,70 C -40,75 -20,60 0,55 C -50,10 -70,-40 -90,-80 Z" fill="#f472b6" opacity="0.85" />
    <path d="M 90,-80 C 120,-30 110,30 70,70 C 40,75 20,60 0,55 C 50,10 70,-40 90,-80 Z" fill="#f472b6" opacity="0.85" />
    
    <!-- Central Main Petal -->
    <path d="M 0,-150 C -35,-90 -45,-30 -30,60 C -10,75 10,75 30,60 C 45,-30 35,-90 0,-150 Z" fill="#ffffff" />
    
    <!-- Core Golden Pearl / Ovulation spark -->
    <circle cx="0" cy="20" r="14" fill="#fbbf24" filter="url(#shadow)" />
  </g>

  <!-- Biometric Vitals Pulse Wave -->
  <path d="M 120,380 L 190,380 L 215,350 L 235,410 L 260,335 L 285,420 L 305,370 L 325,380 L 392,380" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.95" />
</svg>
